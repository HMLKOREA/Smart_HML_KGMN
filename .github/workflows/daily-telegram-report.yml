name: 일일 배차 보고 자동전송 (텔레그램·네이버웍스·Teams)

# 매일 23:59 KST(=14:59 UTC)에 배차 보고를 텔레그램 + 네이버웍스 + Teams로 전송한다.
# 데이터는 신규 시스템(Supabase)에서 읽으므로 컷오버 후에도 그대로 유효. 전부 클라우드(PC 무관).
# 수동 실행(workflow_dispatch)도 가능 — 테스트용.
on:
  schedule:
    - cron: '59 14 * * *'   # 14:59 UTC = 23:59 KST
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: KST 날짜 계산
        id: kst
        run: |
          # 자정 직후로 지연 실행되면 전날로 보정.
          H=$(TZ=Asia/Seoul date +%H)
          if [ "$H" = "00" ]; then
            DATE=$(TZ=Asia/Seoul date -d 'yesterday' +%F)
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "전송 대상일(KST): $DATE"

      - name: 네이버웍스 전송
        run: |
          HTTP=$(curl -s -o resp2.json -w "%{http_code}" \
            -X POST "https://smart-hml.vercel.app/api/naverworks" \
            -H "Content-Type: application/json" \
            -d '{"date":"${{ steps.kst.outputs.date }}"}')
          echo "네이버웍스 HTTP $HTTP"; cat resp2.json; echo ""
          case "$HTTP" in 2*) echo "✅ 네이버웍스 OK";; *) echo "❌ 네이버웍스 실패"; exit 1;; esac

      - name: Teams 전송
        run: |
          HTTP=$(curl -s -o resp3.json -w "%{http_code}" \
            -X POST "https://smart-hml.vercel.app/api/teams" \
            -H "Content-Type: application/json" \
            -d '{"date":"${{ steps.kst.outputs.date }}"}')
          echo "Teams HTTP $HTTP"; cat resp3.json; echo ""
          case "$HTTP" in 2*) echo "✅ Teams OK";; *) echo "❌ Teams 실패"; exit 1;; esac

      - name: 텔레그램 전송 (신규 시스템 기준 배차 보고)
        if: always()   # 앞 단계 실패해도 텔레그램은 발송
        run: |
          HTTP=$(curl -s -o resp1.json -w "%{http_code}" \
            -X POST "https://smart-hml.vercel.app/api/telegram" \
            -H "Content-Type: application/json" \
            -d '{"date":"${{ steps.kst.outputs.date }}"}')
          echo "텔레그램 HTTP $HTTP"; cat resp1.json; echo ""
          case "$HTTP" in 2*) echo "✅ 텔레그램 OK";; *) echo "❌ 텔레그램 실패"; exit 1;; esac
