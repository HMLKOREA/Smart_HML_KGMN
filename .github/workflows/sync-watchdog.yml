name: 동기화 감시견 (텔레그램 경고)

# 업무시간(KST 08~20) 2시간마다 sync 지연 감지. 지연 시에만 텔레그램 경고(정상이면 조용).
# 휘 PC와 무관하게 클라우드에서 실행 → 동기화 누락을 놓치지 않음.
on:
  schedule:
    - cron: '0 23,1,3,5,7,9,11 * * *'   # UTC → KST 08,10,12,14,16,18,20
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: 동기화 지연 점검
        run: |
          HTTP=$(curl -s -o resp.json -w "%{http_code}" \
            -X POST "https://smart-hml.vercel.app/api/cron/sync-watch")
          echo "HTTP $HTTP"; cat resp.json; echo ""
          case "$HTTP" in 2*) echo "OK";; *) echo "watchdog call failed"; exit 1;; esac
